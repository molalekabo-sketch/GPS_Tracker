<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time GPS Tracker</title>
    
    <!-- Leaflet Map Library (Open-source, no API key needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- MQTT.js for real-time GPS updates -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        /* Telemetry Overlay Panel */
        #telemetry-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 999;
            min-width: 280px;
            color: white;
            font-weight: 500;
        }

        #telemetry-panel h2 {
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .telemetry-label {
            opacity: 0.9;
        }

        .telemetry-value {
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        /* Stats Panel */
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 999;
            min-width: 200px;
            font-size: 12px;
            color: #333;
        }

        #stats-panel h3 {
            margin-bottom: 10px;
            color: #667eea;
            font-size: 14px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .stat-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            opacity: 0.7;
        }

        .stat-value {
            font-weight: bold;
            color: #764ba2;
            font-family: 'Courier New', monospace;
        }

        /* Control Panel */
        #control-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 999;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Connection status indicator */
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Path trail styling */
        .leaflet-popup-content {
            font-size: 12px;
            width: auto;
        }

        /* Format Toggle */
        #format-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 6px;
            z-index: 999;
            font-size: 11px;
        }

        #format-toggle label {
            margin: 0 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        #format-toggle input[type="radio"] {
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Telemetry Data Panel -->
    <div id="telemetry-panel">
        <h2><span class="status-indicator"></span>Asset Telemetry</h2>
        <div class="telemetry-row">
            <span class="telemetry-label">Latitude:</span>
            <span class="telemetry-value" id="lat-value">-33.9249</span>
        </div>
        <div class="telemetry-row">
            <span class="telemetry-label">Longitude:</span>
            <span class="telemetry-value" id="lon-value">18.4241</span>
        </div>
        <div class="telemetry-row">
            <span class="telemetry-label">Voltage:</span>
            <span class="telemetry-value" id="volt-value">12.60 V</span>
        </div>
        <div class="telemetry-row">
            <span class="telemetry-label">Last Update:</span>
            <span class="telemetry-value" id="time-value">--:--:--</span>
        </div>
    </div>

    <!-- Statistics Panel -->
    <div id="stats-panel">
        <h3>📊 Track Statistics</h3>
        <div class="stat-item">
            <span class="stat-label">Points Tracked:</span>
            <span class="stat-value" id="stat-points">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Voltage (Min):</span>
            <span class="stat-value" id="stat-volt-min">--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Voltage (Max):</span>
            <span class="stat-value" id="stat-volt-max">--</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Coverage:</span>
            <span class="stat-value" id="stat-coverage">-- km</span>
        </div>
    </div>

    <!-- Control Buttons -->
    <div id="control-panel">
        <button onclick="clearTrack()">🗑️ Clear Track</button>
        <button onclick="centerMap()">📍 Center Map</button>
        <button onclick="downloadTrack()">⬇️ Export Data</button>
    </div>

    <!-- Format Toggle -->
    <div id="format-toggle">
        <label><input type="radio" name="format" value="dd" checked onchange="updateCoordinateFormat()"> Decimal Degrees</label>
        <label><input type="radio" name="format" value="dms" onchange="updateCoordinateFormat()"> DMS</label>
        <label><input type="radio" name="format" value="ddm" onchange="updateCoordinateFormat()"> DDM</label>
    </div>

    <script>
        let map;
        let marker;
        let polyline;
        let coordinateHistory = [];
        let mqttClient;
        let isConnected = false;
        let currentFormat = 'dd'; // Decimal Degrees by default
        let lastGPSData = null;

        // HiveMQ Configuration
        const MQTT_BROKER = 'wss://1e129245fe62491cb0e691c34b75ae34.s1.eu.hivemq.cloud:8884/mqtt';
        const MQTT_USER = 'admin';
        const MQTT_PASS = 'Admin12345';
        const MQTT_TOPIC = 'SimuTech/gps/location';

        // Coordinate Conversion Functions
        function decimalDegreesToDMS(decimal, isLat) {
            const direction = isLat ? (decimal >= 0 ? 'N' : 'S') : (decimal >= 0 ? 'E' : 'W');
            decimal = Math.abs(decimal);
            const degrees = Math.floor(decimal);
            const minutes = Math.floor((decimal - degrees) * 60);
            const seconds = ((decimal - degrees - minutes / 60) * 3600).toFixed(2);
            return `${degrees}° ${minutes}' ${seconds}" ${direction}`;
        }

        function decimalDegreesToDDM(decimal, isLat) {
            const direction = isLat ? (decimal >= 0 ? 'N' : 'S') : (decimal >= 0 ? 'E' : 'W');
            decimal = Math.abs(decimal);
            const degrees = Math.floor(decimal);
            const minutes = ((decimal - degrees) * 60).toFixed(4);
            return `${degrees}° ${minutes}' ${direction}`;
        }

        function formatCoordinates(lat, lon, format) {
            switch(format) {
                case 'dms':
                    return {
                        lat: decimalDegreesToDMS(lat, true),
                        lon: decimalDegreesToDMS(lon, false)
                    };
                case 'ddm':
                    return {
                        lat: decimalDegreesToDDM(lat, true),
                        lon: decimalDegreesToDDM(lon, false)
                    };
                default: // 'dd' - Decimal Degrees
                    return {
                        lat: lat.toFixed(6),
                        lon: lon.toFixed(6)
                    };
            }
        }

        function updateCoordinateFormat() {
            currentFormat = document.querySelector('input[name="format"]:checked').value;
            if (lastGPSData) {
                updateDisplay(lastGPSData);
            }
        }

        // Initialize MQTT connection
        function initMQTT() {
            try {
                mqttClient = new Paho.MQTT.Client(MQTT_BROKER, 'esp32_gps_web_' + Math.random().toString(16).substr(2, 8));
                
                mqttClient.onConnectionLost = onConnectionLost;
                mqttClient.onMessageArrived = onMessageArrived;

                // Connect options
                const connectOptions = {
                    onSuccess: onConnectSuccess,
                    onFailure: onConnectFailure,
                    useSSL: true,
                    userName: MQTT_USER,
                    password: MQTT_PASS,
                    reconnect: true,
                    cleanSession: true
                };

                mqttClient.connect(connectOptions);
                console.log('Attempting MQTT connection to HiveMQ...');
            } catch (err) {
                console.error('MQTT connection error:', err);
            }
        }

        function onConnectSuccess() {
            console.log('Connected to HiveMQ!');
            document.querySelector('.status-indicator').classList.remove('disconnected');
            isConnected = true;
            
            // Subscribe to GPS topic
            mqttClient.subscribe(MQTT_TOPIC, { qos: 1 });
            console.log('Subscribed to topic:', MQTT_TOPIC);
        }

        function onConnectFailure(response) {
            console.error('MQTT connection failed:', response.errorMessage);
            document.querySelector('.status-indicator').classList.add('disconnected');
            isConnected = false;
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log('Connection lost:', responseObject.errorMessage);
                document.querySelector('.status-indicator').classList.add('disconnected');
                isConnected = false;
            }
        }

        function onMessageArrived(message) {
            try {
                const payload = JSON.parse(message.payloadString);
                console.log('GPS Data received:', payload);
                
                lastGPSData = payload;
                updateDisplay(payload);
            } catch (err) {
                console.error('Error parsing GPS data:', err);
            }
        }

        function updateDisplay(data) {
            if (!data.latitude || !data.longitude) return;

            const pos = [parseFloat(data.latitude), parseFloat(data.longitude)];
            const timestamp = new Date();
            const formattedCoords = formatCoordinates(data.latitude, data.longitude, currentFormat);

            // Update marker position
            marker.setLatLng(pos);
            marker.setPopupContent(`
                <strong>ESP32-S3 GPS Tracker</strong><br>
                Lat: ${formattedCoords.lat}<br>
                Lon: ${formattedCoords.lon}<br>
                Altitude: ${data.altitude ? data.altitude.toFixed(2) + ' m' : 'N/A'}<br>
                Speed: ${data.speed ? data.speed.toFixed(2) + ' m/s' : 'N/A'}<br>
                Time: ${timestamp.toLocaleTimeString()}
            `);

            // Add to history and polyline
            coordinateHistory.push({
                lat: data.latitude,
                lon: data.longitude,
                altitude: data.altitude || 0,
                speed: data.speed || 0,
                timestamp: timestamp.toISOString()
            });

            polyline.addLatLng(pos);

            // Auto-pan to stay centered on asset
            map.panTo(pos);

            // Adjust zoom on first location
            if (map.getZoom() < 15) {
                map.setZoom(16);
            }

            // Update telemetry display with formatted coordinates
            document.getElementById('lat-value').textContent = formattedCoords.lat;
            document.getElementById('lon-value').textContent = formattedCoords.lon;
            document.getElementById('volt-value').textContent = (data.altitude ? data.altitude.toFixed(2) + ' m' : 'N/A');
            document.getElementById('time-value').textContent = timestamp.toLocaleTimeString();

            // Update statistics
            updateStats();
        }

        // Initialize map on page load
        function initMap() {
            const defaultPos = [-33.9249, 18.4241]; // Cape Town
            
            map = L.map('map', {
                center: defaultPos,
                zoom: 13,
                layers: [
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors',
                        maxZoom: 19
                    })
                ]
            });

            // Add current location marker
            marker = L.circleMarker(defaultPos, {
                radius: 8,
                fillColor: '#667eea',
                color: '#764ba2',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('Waiting for GPS data...');

            // Initialize empty polyline for path trail
            polyline = L.polyline([], {
                color: '#667eea',
                weight: 3,
                opacity: 0.7,
                smoothFactor: 1
            }).addTo(map);

            console.log('Map initialized at', defaultPos);

            // Initialize MQTT connection
            initMQTT();
        }

        // Update stats panel
        function updateStats() {
            if (coordinateHistory.length === 0) return;

            const lats = coordinateHistory.map(c => c.lat);
            const lons = coordinateHistory.map(c => c.lon);

            // Calculate approximate distance (simple Euclidean)
            let totalDistance = 0;
            for (let i = 1; i < coordinateHistory.length; i++) {
                const prev = coordinateHistory[i - 1];
                const curr = coordinateHistory[i];
                const latDiff = (curr.lat - prev.lat) * 111; // 1° lat ≈ 111 km
                const lonDiff = (curr.lon - prev.lon) * 111 * Math.cos(curr.lat * Math.PI / 180);
                totalDistance += Math.sqrt(latDiff * latDiff + lonDiff * lonDiff);
            }

            document.getElementById('stat-points').textContent = coordinateHistory.length;
            document.getElementById('stat-volt-min').textContent = '--';
            document.getElementById('stat-volt-max').textContent = '--';
            document.getElementById('stat-coverage').textContent = totalDistance.toFixed(2);
        }

        // Control Functions
        function clearTrack() {
            coordinateHistory = [];
            polyline.setLatLngs([]);
            document.getElementById('stat-points').textContent = '0';
            console.log('Track cleared');
        }

        function centerMap() {
            if (coordinateHistory.length > 0) {
                const latest = coordinateHistory[coordinateHistory.length - 1];
                map.setView([latest.lat, latest.lon], 16);
            }
        }

        function downloadTrack() {
            if (coordinateHistory.length === 0) {
                alert('No track data to download');
                return;
            }
            
            const csv = 'Latitude,Longitude,Altitude,Speed,Timestamp\n' +
                coordinateHistory.map(c => `${c.lat},${c.lon},${c.altitude},${c.speed},"${c.timestamp}"`).join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gps-track-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
        }

        // Initialize on page load
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
