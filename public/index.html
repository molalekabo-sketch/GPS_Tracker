<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time GPS Tracker</title>

    <!-- Leaflet Map Library (served locally so the app can run without cloud access) -->
    <link rel="stylesheet" href="/vendor/leaflet/dist/leaflet.css" />
    <script src="/vendor/leaflet/dist/leaflet.js"></script>

    <!-- Socket.IO client (served by server.js) -->
    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        /* Make panels compact on portrait/small screens */
        @media (orientation: portrait), (max-width: 520px) {
            #map {
                height: 60vh;
            }

            #telemetry-panel,
            #stats-panel {
                left: 12px;
                right: 12px;
                width: auto;
                top: auto;
                max-width: 100%;
            }

            #telemetry-panel {
                bottom: 140px;
                min-width: 0;
            }

            #stats-panel {
                bottom: 220px;
                top: auto;
                min-width: 0;
            }

            #control-panel {
                left: 12px;
                right: 12px;
                bottom: 12px;
                padding: 10px;
                flex-wrap: wrap;
                gap: 8px;
                width: auto;
                max-width: calc(100% - 24px);
            }

            button {
                padding: 8px 10px;
                font-size: 11px;
                white-space: nowrap;
            }

            #format-toggle {
                right: 12px;
                bottom: 190px;
                max-width: calc(100% - 24px);
            }

            #format-toggle label {
                display: inline-flex;
                margin: 0 4px;
                white-space: nowrap;
            }
        }

        /* Handle very short phones (avoid overlay overlap) */
        @media (max-height: 700px) and (orientation: portrait) {
            #map {
                height: 55vh;
            }

            #telemetry-panel {
                bottom: 120px;
                padding: 14px;
            }

            #stats-panel {
                bottom: 200px;
                padding: 12px;
            }

            #format-toggle {
                bottom: 175px;
            }

            #control-panel {
                padding: 10px;
            }
        }

        /* Telemetry Overlay Panel */
        #telemetry-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 999;
            min-width: 280px;
            color: white;
            font-weight: 500;
        }

        #telemetry-panel h2 {
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .telemetry-label {
            opacity: 0.9;
        }

        .telemetry-value {
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        /* Stats Panel */
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 999;
            min-width: 200px;
            font-size: 12px;
            color: #333;
        }

        #stats-panel h3 {
            margin-bottom: 10px;
            color: #667eea;
            font-size: 14px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .stat-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            opacity: 0.7;
        }

        .stat-value {
            font-weight: bold;
            color: #764ba2;
            font-family: 'Courier New', monospace;
        }

        /* Control Panel */
        #control-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 999;
            display: flex;
            gap: 10px;
            max-width: calc(100% - 40px);
        }

        button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Connection status indicator */
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.disconnected {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Path trail styling */
        .leaflet-popup-content {
            font-size: 12px;
            width: auto;
        }

        /* Format Toggle */
        #format-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 6px;
            z-index: 999;
            font-size: 11px;
        }

        #format-toggle label {
            margin: 0 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        #format-toggle input[type="radio"] {
            margin-right: 5px;
            cursor: pointer;
        }

        #map, #telemetry-panel, #stats-panel, #control-panel, #format-toggle {
            touch-action: manipulation;
        }

        /* Collapse overlay content on small screens */
        @media (orientation: portrait), (max-width: 520px) {
            .overlay-collapse-toggle {
                display: flex;
            }
        }

        .overlay-collapse-toggle {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(0,0,0,0.15);
            color: #fff;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            user-select: none;
        }

        #stats-panel .overlay-collapse-toggle,
        #control-panel .overlay-collapse-toggle {
            color: #2b2b2b;
            border: 1px solid rgba(0,0,0,0.12);
            background: rgba(255,255,255,0.6);
        }

        .overlay-body {
            display: block;
        }

        .panel-collapsed .overlay-body {
            display: none;
        }

    </style>
</head>
<body>
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Telemetry Data Panel -->
    <div id="telemetry-panel">
        <div class="overlay-collapse-toggle" data-target="telemetry-panel" aria-label="Collapse telemetry">
            ▾
        </div>
        <div class="overlay-body">
            <h2><span class="status-indicator"></span>Vehicle Telemetry</h2>
            <div class="telemetry-row">
                <span class="telemetry-label">Latitude:</span>
                <span class="telemetry-value" id="lat-value">--</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">Longitude:</span>
                <span class="telemetry-value" id="lon-value">--</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">Altitude:</span>
                <span class="telemetry-value" id="alt-value">--</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">Speed:</span>
                <span class="telemetry-value" id="speed-value">--</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">Voltage:</span>
                <span class="telemetry-value" id="volt-value">--</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">Current:</span>
                <span class="telemetry-value" id="current-value">--</span>
            </div>
            <div class="telemetry-row">
                <span class="telemetry-label">Last Update:</span>
                <span class="telemetry-value" id="time-value">--:--:--</span>
            </div>
            <div class="telemetry-row">
                <button onclick="clearTrack()" title="Clear Track" style="padding: 6px 12px; cursor: pointer; flex: 1;">🗑️ Clear Track</button>
            </div>
            <!-- Com ports    Entry-->
             <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px;">
                <div style="display: flex; gap: 6px; align-items: center;">
                    <label for="port-select" style="font-size: 12px; color: #f8f9fa;">Serial Port</label>
                    <select id="port-select" style="flex: 1; padding: 6px; border-radius: 4px; border: 1px solid #ced4da;"></select>
                </div>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <button onclick="refreshSerialPorts()" style="padding: 6px 10px; flex: 1; background: #6c757d;">Refresh</button>
                    <button onclick="connectSerialPort()" style="padding: 6px 10px; flex: 1; background: #28a745;">Connect</button>
                    <button onclick="disconnectSerialPort()" style="padding: 6px 10px; flex: 1; background: #dc3545;">Disconnect</button>
                </div>
                <div id="serial-status-text" style="font-size: 11px; color: #f1f3f5;">Serial: disconnected</div>
            </div>
        </div>
    </div>

    <!-- Statistics Panel -->
    <div id="stats-panel">
        <div class="overlay-collapse-toggle" data-target="stats-panel" aria-label="Collapse statistics">
            ▾
        </div>
        <div class="overlay-body">
            <h3>📊 Track Statistics</h3>
            <div class="stat-item">
                <span class="stat-label">Points Tracked:</span>
                <span class="stat-value" id="stat-points">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Distance (km):</span>
                <span class="stat-value" id="stat-distance">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Max Speed:</span>
                <span class="stat-value" id="stat-max-speed">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Time Elapsed (s):</span>
                <span class="stat-value" id="stat-time">--</span>
            </div>            
        </div>
    </div>

    <!-- Format Toggle -->
    <div id="format-toggle">
        <label><input type="radio" name="format" value="dd" checked onchange="updateCoordinateFormat()"> Decimal Degrees</label>
        <label><input type="radio" name="format" value="dms" onchange="updateCoordinateFormat()"> DMS</label>
        <label><input type="radio" name="format" value="ddm" onchange="updateCoordinateFormat()"> DDM</label>
    </div>

    <script src="/stats.js"></script>
    <script>
        let map;
        let marker;
        let polyline;
        let coordinateHistory = [];
        let isConnected = false;
        let currentFormat = 'dd'; // Decimal Degrees by default
        let lastGPSData = null;

        // Await-first-fix state (avoid any generated/default coordinate data)
        let hasFirstFix = false;

        // Coordinate Conversion Functions
        function decimalDegreesToDMS(decimal, isLat) {
            const direction = isLat ? (decimal >= 0 ? 'N' : 'S') : (decimal >= 0 ? 'E' : 'W');
            decimal = Math.abs(decimal);
            const degrees = Math.floor(decimal);
            const minutes = Math.floor((decimal - degrees) * 60);
            const seconds = ((decimal - degrees - minutes / 60) * 3600).toFixed(2);
            return `${degrees}° ${minutes}' ${seconds}" ${direction}`;
        }

        function decimalDegreesToDDM(decimal, isLat) {
            const direction = isLat ? (decimal >= 0 ? 'N' : 'S') : (decimal >= 0 ? 'E' : 'W');
            decimal = Math.abs(decimal);
            const degrees = Math.floor(decimal);
            const minutes = ((decimal - degrees) * 60).toFixed(4);
            return `${degrees}° ${minutes}' ${direction}`;
        }

        function formatCoordinates(lat, lon, format) {
            switch(format) {
                case 'dms':
                    return {
                        lat: decimalDegreesToDMS(lat, true),
                        lon: decimalDegreesToDMS(lon, false)
                    };
                case 'ddm':
                    return {
                        lat: decimalDegreesToDDM(lat, true),
                        lon: decimalDegreesToDDM(lon, false)
                    };
                default:
                    return {
                        lat: lat.toFixed(6),
                        lon: lon.toFixed(6)
                    };
            }
        }

        function updateCoordinateFormat() {
            currentFormat = document.querySelector('input[name="format"]:checked').value;
            if (lastGPSData) {
                updateDisplay(lastGPSData);
            }
        }

        // Socket.IO client: receives complete assembled coordinates from server.js
        function initSocket() {
            const socket = io();

            socket.on('connect', () => {
                console.log('[UI] Socket.IO connected:', socket.id);
                document.querySelector('.status-indicator').classList.remove('disconnected');
            });

            socket.on('disconnect', () => {
                console.log('[UI] Socket.IO disconnected');
                document.querySelector('.status-indicator').classList.add('disconnected');
            });

            socket.on('location_update', (data) => {
                lastGPSData = data;
                updateDisplay(data);
            });

            socket.on('serial_status', (data) => {
                updateSerialStatus(data);
            });
        }

        function updateSerialStatus(data) {
            const indicator = document.querySelector('.status-indicator');
            const statusText = document.getElementById('serial-status-text');
            const connected = Boolean(data && data.connected);
            isConnected = connected;

            if (indicator) {
                indicator.classList.toggle('disconnected', !connected);
            }

            if (statusText) {
                const portPart = data && data.port ? ` on ${data.port}` : '';
                const desiredStatus = data && data.status ? data.status : 'disconnected';
                const errorMessage = data && data.error ? data.error : '';
                const hintMessage = data && data.hint ? ` ${data.hint}` : '';
                const message = [
                    `Serial: ${desiredStatus}${portPart}`,
                    errorMessage ? `• ${errorMessage}` : '',
                    hintMessage ? `• ${hintMessage}` : ''
                ].filter(Boolean).join(' ');
                statusText.textContent = message;
            }
        }

        async function refreshSerialPorts() {
            try {
                const response = await fetch('/api/serial/ports');
                const data = await response.json();
                const select = document.getElementById('port-select');
                if (!select) return;

                select.innerHTML = '';
                const ports = data.ports || [];

                if (!ports.length) {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'No ports detected';
                    select.appendChild(option);
                    updateSerialStatus(data);
                    return;
                }

                ports.forEach((port) => {
                    const option = document.createElement('option');
                    option.value = port;
                    option.textContent = port;
                    if (port === data.selectedPort) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                if (!select.value) {
                    select.value = ports[0];
                }

                updateSerialStatus(data);
            } catch (error) {
                console.error('Unable to refresh serial ports:', error);
            }
        }

        async function connectSerialPort(selectedPort = null) {
            const select = document.getElementById('port-select');
            const port = selectedPort || (select ? select.value : null);
            if (!port) {
                alert('No serial port is available. Connect the ESP32 USB cable first.');
                return;
            }

            try {
                const response = await fetch('/api/serial/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port })
                });
                const data = await response.json();
                if (!response.ok) {
                    updateSerialStatus({ connected: false, status: 'error', port, error: data && data.error ? data.error : 'Unable to connect to the serial port', hint: data && data.hint ? data.hint : null });
                    alert(data && data.error ? data.error : 'Unable to connect to the serial port');
                    return;
                }
                updateSerialStatus({ connected: true, status: 'connected', port, error: null });
            } catch (error) {
                console.error('Serial connect failed:', error);
                alert('Unable to connect to the selected serial port');
            }
        }

        async function disconnectSerialPort() {
            try {
                const response = await fetch('/api/serial/disconnect', { method: 'POST' });
                const data = await response.json();
                if (!response.ok) {
                    alert(data && data.error ? data.error : 'Unable to disconnect from the serial port');
                    return;
                }
                updateSerialStatus({ connected: false, status: 'disconnected', port: null, error: null });
            } catch (error) {
                console.error('Serial disconnect failed:', error);
                alert('Unable to disconnect from the serial port');
            }
        }

        function updateDisplay(data) {
            const lat = data.latitude;
            const lon = data.longitude;
            if (lat === undefined || lon === undefined) return;
            if (lat === null || lon === null) return;

            const latNum = parseFloat(lat);
            const lonNum = parseFloat(lon);
            if (!Number.isFinite(latNum) || !Number.isFinite(lonNum)) return;

            const pos = [latNum, lonNum];
            const timestamp = new Date();
            const formattedCoords = formatCoordinates(latNum, lonNum, currentFormat);

            marker.setLatLng(pos);
            marker.setStyle({ opacity: 1, fillOpacity: 0.8 });
            marker.setPopupContent(`
                <strong>ESP32-S3 GPS Tracker</strong><br>
                Lat: ${formattedCoords.lat}<br>
                Lon: ${formattedCoords.lon}<br>
                Altitude: ${data.altitude ? parseFloat(data.altitude).toFixed(2) + ' m' : 'N/A'}<br>
                Speed: ${data.speed ? parseFloat(data.speed).toFixed(2) + ' m/s' : 'N/A'}<br>
                Time: ${timestamp.toLocaleTimeString()}
            `);

            coordinateHistory.push({
                lat: latNum,
                lon: lonNum,
                altitude: data.altitude ? parseFloat(data.altitude) : 0,
                speed: data.speed ? parseFloat(data.speed) : 0,
                timestamp: timestamp.toISOString()
            });

            polyline.addLatLng(pos);
            map.panTo(pos);

            if (!hasFirstFix) {
                hasFirstFix = true;
                map.setZoom(16);
            }

            document.getElementById('lat-value').textContent = formattedCoords.lat;
            document.getElementById('lon-value').textContent = formattedCoords.lon;

            const altNum = data.altitude !== undefined && data.altitude !== null ? parseFloat(data.altitude) : NaN;
            const speedNum = data.speed !== undefined && data.speed !== null ? parseFloat(data.speed) : NaN;

            const voltNum = data.voltage !== undefined && data.voltage !== null ? parseFloat(data.voltage) : NaN;
            const currentNum = data.current !== undefined && data.current !== null ? parseFloat(data.current) : NaN;

            document.getElementById('volt-value').textContent = Number.isFinite(voltNum) ? `${voltNum.toFixed(2)} V` : 'N/A';
            document.getElementById('current-value').textContent = Number.isFinite(currentNum) ? `${currentNum.toFixed(2)} A` : 'N/A';
            document.getElementById('alt-value').textContent = Number.isFinite(altNum) ? `${altNum.toFixed(2)} m` : 'N/A';
            document.getElementById('speed-value').textContent = Number.isFinite(speedNum) ? `${speedNum.toFixed(2)} m/s` : 'N/A';
            document.getElementById('backlog-value').textContent = data.isBacklog ? 'Yes' : 'No';

            document.getElementById('time-value').textContent = timestamp.toLocaleTimeString();

            updateStats();
        }

        function initMap() {
            const initialCenter = [0, 0];

            map = L.map('map', {
                center: initialCenter,
                zoom: 2,
                layers: [
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors',
                        maxZoom: 19
                    })
                ]
            });

            marker = L.circleMarker(initialCenter, {
                radius: 8,
                fillColor: '#667eea',
                color: '#764ba2',
                weight: 3,
                opacity: 0,
                fillOpacity: 0
            }).addTo(map).bindPopup('Waiting for first GPS fix...');

            polyline = L.polyline([], {
                color: '#667eea',
                weight: 3,
                opacity: 0.7,
                smoothFactor: 1
            }).addTo(map);

            initSocket();
        }

        // Stopwatch state
        let isTiming = false;
        let timingStartMs = null;
        let timingEndMs = null;

        function getSegmentPoints() {
            if (!isTiming && timingEndMs === null) return coordinateHistory;
            if (!coordinateHistory.length) return [];

            const startMs = timingStartMs;
            const endMs = timingEndMs;
            if (!Number.isFinite(startMs)) return [];

            const endBound = (endMs === null) ? Infinity : endMs;

            return coordinateHistory.filter((p) => {
                const t = p.timestamp ? Date.parse(p.timestamp) : NaN;
                return Number.isFinite(t) && t >= startMs && t <= endBound;
            });
        }

        function resetStatsDisplay() {
            document.getElementById('stat-points').textContent = '0';
            document.getElementById('stat-distance').textContent = '--';
            document.getElementById('stat-max-speed').textContent = '--';
            document.getElementById('stat-time').textContent = '--';
        }

        function clearTrack() {
            coordinateHistory = [];
            polyline.setLatLngs([]);
            resetStatsDisplay();
            console.log('Track cleared');
        }

        function updateStats() {
            const segment = getSegmentPoints();
            if (!segment || segment.length === 0) {
                resetStatsDisplay();
                return;
            }

            for (const c of segment) {
                if (!Number.isFinite(Number(c.lat)) || !Number.isFinite(Number(c.lon))) {
                    resetStatsDisplay();
                    return;
                }
            }

            const stats = computeTrackStats(segment);
            const pointsEl = document.getElementById('stat-points');
            if (pointsEl) pointsEl.textContent = stats.pointCount;

            const distEl = document.getElementById('stat-distance');
            if (distEl) distEl.textContent = stats.totalDistanceKm.toFixed(2);

            const maxSpeedEl = document.getElementById('stat-max-speed');
            if (maxSpeedEl) {
                if (stats.maxSpeedKmh === null) {
                    maxSpeedEl.textContent = '--';
                } else {
                    maxSpeedEl.textContent = `${stats.maxSpeedKmh.toFixed(2)} km/h`;
                }
            }

            const timeEl = document.getElementById('stat-time');
            if (timeEl) {
                if (!Number.isFinite(stats.elapsedSec) || stats.elapsedSec < 0) {
                    timeEl.textContent = '--';
                } else {
                    const totalSeconds = Math.floor(stats.elapsedSec);
                    const hours = Math.floor(totalSeconds / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    const seconds = totalSeconds % 60;
                    const pad2 = (n) => String(n).padStart(2, '0');
                    timeEl.textContent = `${hours}:${pad2(minutes)}:${pad2(seconds)}`;
                }
            }
        }

        function startStopwatch() {
            if (coordinateHistory.length === 0) return;
            const latest = coordinateHistory[coordinateHistory.length - 1];
            const t = latest.timestamp ? Date.parse(latest.timestamp) : NaN;
            if (!Number.isFinite(t)) {
                alert('Cannot start: invalid timestamp in data');
                return;
            }
            isTiming = true;
            timingStartMs = t;
            timingEndMs = null;
        }

        function stopStopwatch() {
            if (!isTiming) return;
            const latest = coordinateHistory[coordinateHistory.length - 1];
            const t = latest.timestamp ? Date.parse(latest.timestamp) : NaN;
            if (!Number.isFinite(t)) return;
            timingEndMs = t;
            isTiming = false;
        }

        function centerMap() {
            if (coordinateHistory.length > 0) {
                const latest = coordinateHistory[coordinateHistory.length - 1];
                map.setView([latest.lat, latest.lon], 16);
            }
        }

        function downloadTrack() {
            if (coordinateHistory.length === 0) {
                alert('No track data to download');
                return;
            }

            const csv = 'Latitude,Longitude,Altitude,Speed,Timestamp\n' +
                coordinateHistory.map(c => `${c.lat},${c.lon},${c.altitude},${c.speed},"${c.timestamp}"`).join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gps-track-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
        }

        async function uploadTrackCSV() {
            const input = document.getElementById('csv-file');
            if (!input || !input.files || input.files.length === 0) {
                alert('Select a CSV file first');
                return;
            }

            const file = input.files[0];
            if (!file.name.toLowerCase().endsWith('.csv')) {
                alert('Please upload a .csv file');
                return;
            }

            const formData = new FormData();
            formData.append('csv', file);

            try {
                const resp = await fetch('/api/upload-csv', {
                    method: 'POST',
                    body: formData
                });

                const data = await resp.json().catch(() => null);
                if (!resp.ok) {
                    alert((data && data.error) ? data.error : 'Upload failed');
                    return;
                }

                clearTrack();
                alert(`Upload successful: loaded ${data.points_loaded} points`);
            } catch (e) {
                console.error('uploadTrackCSV error:', e);
                alert('Upload failed due to a network/server error');
            }
        }

        function toggleDiv(targetId) {
            const panel = document.getElementById(targetId);
            if (!panel) return;

            const shouldExpand = panel.classList.contains('panel-collapsed');
            panel.classList.toggle('panel-collapsed', !shouldExpand);

            const t = document.querySelector(`.overlay-collapse-toggle[data-target="${targetId}"]`);
            if (t) t.textContent = shouldExpand ? '▾' : '▸';

            // Update toggle visibility on layout reflow
            try {
                panel.style.display = '';
            } catch (e) {}
        }

        function setupOverlayCollapse() {

            const toggleEls = document.querySelectorAll('.overlay-collapse-toggle');
            toggleEls.forEach((el) => {
                el.addEventListener('click', () => {
                    const targetId = el.getAttribute('data-target');
                    const panel = document.getElementById(targetId);
                    if (!panel) return;

                    const collapsed = !panel.classList.contains('panel-collapsed');
                    panel.classList.toggle('panel-collapsed', collapsed);
                    el.textContent = collapsed ? '▸' : '▾';
                });
            });

            // Auto-collapse on initial small screens
            const isSmall = window.matchMedia('(orientation: portrait), (max-width: 520px)').matches;
            if (isSmall) {
                ['telemetry-panel', 'stats-panel', 'control-panel'].forEach((id) => {
                    const panel = document.getElementById(id);
                    const t = document.querySelector(`.overlay-collapse-toggle[data-target="${id}"]`);
                    if (!panel || !t) return;
                    panel.classList.add('panel-collapsed');
                    t.textContent = '▸';
                });
            }

            // Auto-collapse/expand when screen size changes
            const mq = window.matchMedia('(orientation: portrait), (max-width: 520px)');
            mq.addEventListener('change', (e) => {
                const shouldCollapse = e.matches;
                ['telemetry-panel', 'stats-panel', 'control-panel'].forEach((id) => {
                    const panel = document.getElementById(id);
                    const t = document.querySelector(`.overlay-collapse-toggle[data-target="${id}"]`);
                    if (!panel || !t) return;
                    panel.classList.toggle('panel-collapsed', shouldCollapse);
                    t.textContent = shouldCollapse ? '▸' : '▾';
                });
            });
        }

        window.addEventListener('load', async () => {
            setupOverlayCollapse();
            initMap();
            await refreshSerialPorts();
        });
    </script>
</body>
</html>
